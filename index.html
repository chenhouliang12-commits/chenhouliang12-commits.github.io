<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>午夜钟表匠的工坊</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%B0%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=20260920f">
</head>
<body>
<div id="app">

  <!-- 开始界面 -->
  <div id="start-screen" class="screen">
    <div class="start-card">
      <div class="start-emblem">🕰️</div>
      <h1>午夜钟表匠的工坊</h1>
      <p class="start-sub">午夜钟声响起后，大门自行锁死。<br>收集线索、破解机关，把时间放回原处。</p>
      <div class="start-actions">
        <button id="btn-continue" class="btn primary">继续游戏</button>
        <button id="btn-new" class="btn">重新开始</button>
      </div>
    </div>
  </div>

  <!-- 游戏界面 -->
  <div id="game-screen" class="screen hidden">
    <header id="topbar">
      <button id="btn-notebook" class="top-btn">📓 笔记本</button>
      <div id="room-meta">
        <div id="room-title">前厅工坊</div>
        <div id="room-sub">炉火未熄，钟声已停</div>
      </div>
      <div class="top-right">
        <button id="btn-save" class="top-btn">💾 保存</button>
        <button id="btn-highlight" class="top-btn">✨ 高亮</button>
        <button id="btn-zoom" class="top-btn" title="放大场景">🔍</button>
        <button id="btn-hint" class="top-btn">💡 提示</button>
        <button id="btn-settings" class="top-btn">⚙️</button>
      </div>
    </header>

    <main id="scene-wrap">
      <div id="scene"></div>
      <div id="dialog" class="dialog"></div>
    </main>

    <footer id="inventory-bar"></footer>
  </div>

</div>

<div id="modal" class="hidden"></div>

<script src="js/data.js?v=20260920f"></script>
<script src="js/audio.js?v=20260920f"></script>
<script src="js/engine.js?v=20260920f"></script>
<script src="js/ui.js?v=20260920f"></script>
<script src="js/scene.js?v=20260920f"></script>
<script src="js/main.js?v=20260920f"></script>
</body>
</html>
